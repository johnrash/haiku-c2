# OpenSSL target for Haiku on AArch64: haiku-common's settings (written out,
# so its os-dep include can skip assembler sources) with the AArch64
# assembler settings of OpenSSL's linux-aarch64 target.
my %targets = (
    "haiku-aarch64" => {
        CC               => "cc",
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-g -O0",
                                   release => "-O2"),
        cflags           => "-DL_ENDIAN -include HAIKU_OS_DEP_H -D_REENTRANT",
        AR               => "ar",
        ARFLAGS          => "qc",
        HASHBANGPERL     => "/bin/env perl",
        sys_id           => "HAIKU",
        ex_libs          => "-lnetwork",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        shared_target    => "linux-shared",
        shared_cflag     => "-fPIC",
        shared_ldflag    => "-shared",
        perl_platform    => "Unix",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "linux64",
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
    },
);
