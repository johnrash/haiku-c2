# TFTP, DHCP and DNS server for the C2, on the crossover link only.
# U-Boot on the C2 uses the static address 10.42.0.2; Haiku asks DHCP for it.
# Start: sudo dnsmasq -C tools/dnsmasq.conf
# DNS on the link only, never forwarded: names for both ends so reverse
# lookups (ftpd, telnetd) are answered at once instead of timing out.
no-resolv
no-hosts
domain=c2.lan
local=/c2.lan/
host-record=c2,c2.c2.lan,10.42.0.2
host-record=laptop,laptop.c2.lan,10.42.0.1
# the host's network interface on the crossover cable (see `ip link`)
interface=enx001122334455
bind-dynamic
except-interface=lo
enable-tftp
# paths: where this repository is
tftp-root=/build/haiku-odroid-c2/tftp
# the user dnsmasq runs as: yours, so that it can write run/
user=YOUR_USER
pid-file=/build/haiku-odroid-c2/run/dnsmasq.pid
log-facility=/build/haiku-odroid-c2/run/dnsmasq.log
# DHCP on the crossover link only (M5 Ethernet): the C2's MAC always gets
# 10.42.0.2 (U-Boot uses that address statically), other hosts a range.
dhcp-range=10.42.0.100,10.42.0.150,255.255.255.0,1h
# the C2's own MAC address (Hardkernel's boards start with 00:1e:06)
dhcp-host=00:1e:06:00:00:00,10.42.0.2
dhcp-authoritative
log-dhcp
# Time: Haiku's default NTP servers resolve to the laptop on this link, where
# tools/sntp-server.py answers (the C2 has no battery-backed clock).
address=/pool.ntp.org/10.42.0.1
address=/time.nist.gov/10.42.0.1
